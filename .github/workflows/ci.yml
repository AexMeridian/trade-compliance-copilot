name: CI

# Deploys are handled by Cloudflare Workers Builds (connected to this repo), not here.
# Checks that need no secrets, database or browser. The golden classification
# suite (needs an Anthropic key) and the route smoke test (needs the seeded
# local database) are run by hand: see package.json "test:golden" / "test:smoke".
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 13 * * 1' # weekly: new advisories appear without any code change

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:frontend
      # Fails on a known high or critical vulnerability in anything that ships to production.
      - run: npm audit --omit=dev --audit-level=high
