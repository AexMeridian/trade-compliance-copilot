name: CI

# Deploys are handled by Cloudflare Workers Builds (connected to this repo), not here.
# Checks that need no secrets, database or browser. The golden classification
# suite (needs an Anthropic key) and the route smoke test (needs the seeded
# local database) are run by hand: see package.json "test:golden" / "test:smoke".
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:frontend
