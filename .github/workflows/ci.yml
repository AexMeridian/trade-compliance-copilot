name: CI

# Checks that need no secrets, database or browser. The golden classification
# suite (needs an Anthropic key) and the route smoke test (needs the seeded
# local database) are run by hand: see package.json "test:golden" / "test:smoke".
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:frontend

  # Ships main to Cloudflare once the checks pass. Needs two repository secrets
  # (Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN (the
  # "Edit Cloudflare Workers" template plus D1 Edit) and CLOUDFLARE_ACCOUNT_ID.
  # Migrations run first and are idempotent: wrangler skips ones already applied.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
