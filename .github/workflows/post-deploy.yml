name: Post-deploy check

# Cloudflare Workers Builds deploys on every push to main. A few minutes later this checks the live site and fails (GitHub emails the owner)
# if the deploy left it unhealthy. Read-only: plain GET requests, no secrets, no model calls.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site
        run: |
          set -u
          BASE=https://aexterminal.com
          # Poll instead of a fixed sleep: wait (up to 10 minutes) for the new deploy to answer healthy.
          ok=0
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/api/health" || echo 000)
            echo "attempt $i: /api/health -> $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 30
          done
          fail=0
          if [ "$ok" != "1" ]; then fail=1; fi
          for path in /api/health /api/pulse/data-status / /calculator /methodology; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE$path" || echo 000)
            echo "$path -> $code"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          # The status endpoint must say the database tables exist and nothing critical is failing.
          body=$(curl -s --max-time 30 "$BASE/api/pulse/data-status")
          echo "$body" | head -c 600; echo
          # Critical keys that mean a bad deploy (missing tables, failed built-in accuracy checks, calculator paused) fail the run.
          # Stale or failing data sources are real but are not a deploy failure: they raise a warning annotation instead, so the run is not red on every push.
          crit=$(echo "$body" | grep -o '"critical":\[[^]]*\]' | head -1)
          echo "critical: $crit"
          if echo "$crit" | grep -Eq '"(schema|canary|model[^"]*)"'; then
            echo "::error::deploy problem: $crit"
            fail=1
          elif echo "$body" | grep -q '"ok":false'; then
            echo "::warning::data health is degraded (stale or failing sources): $crit. See /api/pulse/data-status and docs/OWNER-TODO.md."
          fi
          exit $fail
